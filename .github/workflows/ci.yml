name: CI

on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      # Build AND test the core reactor (common, core, server, plugins), then
      # install it locally so ebms-admin can resolve it. `install` runs the full
      # test phase, so core now gets CI test coverage (previously -DskipTests).
      # Messaging ITs (JMS, Kafka) and URL-mapping ITs need Docker, which is
      # available on GitHub-hosted runners.
      - name: Build, test and install ebms-core
        run: mvn -B -T 1C -f ebms-core/pom.xml clean install -Ddependency-check.skip=true
      # ebms-admin depends on the locally built core artifacts installed above.
      - name: Build and test ebms-admin
        run: mvn -B -T 1C -f ebms-admin/pom.xml clean verify -Ddependency-check.skip=true
