name: CI

on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      # Build AND test the whole core reactor (common, core, server, plugins)
      # and install it locally. `install` runs the full test phase, so the
      # reactor gets CI test coverage (previously -DskipTests). Messaging ITs
      # (JMS, Kafka) and URL-mapping ITs need Docker, which is available on
      # GitHub-hosted runners. The ebms-server shaded jar (the embedded
      # SOAP/REST server, formerly the separate ebms-admin project) is built
      # and tested as part of this reactor.
      - name: Build, test and install ebms-core
        run: mvn -B -T 1C -f ebms-core/pom.xml clean install -Ddependency-check.skip=true
